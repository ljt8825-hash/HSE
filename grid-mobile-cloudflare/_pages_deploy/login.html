<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>网格长巡查 · 登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 92%; max-width: 380px; background: #fff; border-radius: 12px; padding: 28px 22px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; color: #1f2d3d; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 12px; color: #909399; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #606266; margin: 14px 0 6px; }
    input { width: 100%; height: 44px; border: 1px solid #dcdfe6; border-radius: 8px; padding: 0 12px; font-size: 16px; outline: none; }
    input:focus { border-color: #409eff; }
    button { width: 100%; height: 44px; margin-top: 24px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 16px; cursor: pointer; }
    button:disabled { background: #a0cfff; }
    .err { margin-top: 14px; font-size: 13px; color: #f56c6c; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>网格长巡查</h1>
    <div class="sub">手机号 + 密码登录</div>
    <label for="phone">手机号</label>
    <input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="username" placeholder="请输入 11 位手机号" />
    <label for="password">密码</label>
    <input id="password" type="password" maxlength="72" autocomplete="current-password" placeholder="请输入密码" />
    <button id="btn">登 录</button>
    <div class="err" id="err"></div>
  </div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
  <script>
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    btn.addEventListener('click', async () => {
      err.textContent = '';
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      if (!/^1\d{10}$/.test(phone)) { err.textContent = '请输入正确的 11 位手机号'; return; }
      if (!password) { err.textContent = '请输入密码'; return; }
      btn.disabled = true; btn.textContent = '登录中…';
      try {
        const r = await mobileApi('/api/mobile/auth/login', { phone, password });
        if (r.status === 200 && r.body.success) {
          sessionStorage.setItem('h5_session_token', r.body.token);
          sessionStorage.setItem('h5_session_exp', String(Date.now() + (r.body.expiresIn || 7200) * 1000));
          location.href = './home.html';
        } else {
          err.textContent = r.body.message || '登录失败';
        }
      } catch {
        err.textContent = '网络异常，请稍后再试';
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
