<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>巡查详情</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; min-height: 100vh; padding-bottom: 40px; }
    .bar { background: #2563eb; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; display: flex; align-items: center; }
    .bar .back { margin-right: 10px; font-size: 20px; color: #fff; text-decoration: none; }
    .wrap { width: 92%; max-width: 420px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-top: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #f0f2f5; }
    .row:last-child { border-bottom: none; }
    .row .k { color: #909399; flex-shrink: 0; margin-right: 12px; }
    .row .v { color: #1f2d3d; text-align: right; word-break: break-all; }
    .sec { font-size: 14px; font-weight: 600; color: #1f2d3d; margin: 4px 0 8px; }
    .desc { font-size: 14px; color: #1f2d3d; line-height: 1.7; white-space: pre-wrap; word-break: break-all; background: #f8fafc; border-radius: 8px; padding: 10px; }
    .banner { font-size: 14px; border-radius: 10px; padding: 12px; margin-top: 14px; }
    .banner.err { color: #b91c1c; background: #fee2e2; }
    .banner.info { color: #1d4ed8; background: #dbeafe; }
    .vtag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 2px 8px; }
    .vtag.v { color: #b91c1c; background: #fee2e2; }
    .vtag.ok { color: #15803d; background: #dcfce7; }
  </style>
</head>
<body>
  <div class="bar"><a class="back" href="./records.html">‹</a>巡查详情</div>
  <div class="wrap">
    <div id="detail" class="banner info">加载中…</div>
  </div>
  <script src="./config.js?v=2026-10-16.104"></script>
  <script src="./app.js?v=2026-10-16.104"></script>
  <script>
    (async () => {
      if (sessionExpiredLocally()) { clearSession(); redirectToLogin(); return; }
      const id = new URLSearchParams(location.search).get('id') || '';
      const box = document.getElementById('detail');
      const r = await mobileApi('/api/mobile/patrol/records?id=' + encodeURIComponent(id));
      if (r.status !== 200 || !r.body.success) {
        box.className = 'banner err'; box.textContent = r.body.message || '记录不存在'; return;
      }
      const x = r.body.record;
      const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v || '—'}</span></div>`;
      const vTag = x.is_violation === '是' ? '<span class="vtag v">三违</span>' : '<span class="vtag ok">正常</span>';
      const vioSec = x.is_violation === '是' ? `
        <div class="card"><div class="sec">三违信息</div>
          ${row('三违行为描述', '')}${`<div class="desc" style="margin-top:-6px;margin-bottom:8px;">${x.violation_desc || '—'}</div>`}
          ${row('涉及人员', x.violation_people)}
        </div>` : '';
      box.className = ''; box.innerHTML = `
        <div class="card">
          <div class="sec">基本信息 ${vTag}</div>
          ${row('记录编号', x.record_id)}
          ${row('巡查人', (x.name || '') + '（' + (x.employee_code || '') + '）')}
          ${row('巡查时间', x.inspection_time)}
          ${row('网格', x.grid)}
          ${row('问题类型', x.problem_type)}
          ${row('提交日期', x.created_at)}
        </div>
        <div class="card"><div class="sec">问题描述</div><div class="desc">${x.description || '—'}</div></div>
        ${vioSec}
        <div class="card">
          <div class="sec">照片与状态</div>
          ${row('照片状态', x.photo_status === 'PENDING_EXTERNAL' ? 'PENDING_EXTERNAL（WPS 页面预览暂未开放）' : (x.photo_status || '—'))}
          ${row('来源', x.source)}
          ${row('状态', x.test_status)}
        </div>`;
    })();
  </script>
</body>
</html>
