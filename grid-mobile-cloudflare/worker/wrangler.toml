name = "grid-mobile-cloudflare-worker"
main = "deploy.js"
compatibility_date = "2024-09-23"
# ES Module 格式（index.js 使用 export default）

# ---------------------------------------------------------------------------
# 非敏感配置（公开，可提交）
# 端点已按 WPS 365 官方文档 + 生产 wpsClient.js 交叉核对（POC-03 修正 POC-02 错误）：
#   - POC-02 误用 /oauthapi/v1/oauth2/token + app_id/app_key → 已改为 /oauth2/token + client_id/client_secret
#   - 授权地址默认 /oauth2/auth（WPS 365 标准；不再把 oauth2/authorize / oauthapi/v2/authorize 视作默认候选，
#     除非真实 WPS 应用实际返回明确证据）
# POC-03-A 修正：
#   - WPS_SCOPE 由 kso.user_current.read 改为 kso.user_base.read（官方用户授权流程与 /v7/users/current 权限要求一致）
#   - 删除 WPS_API_SIGNATURE 开关：/v7/users/current 按官方文档强制 Bearer + KSO-1，不再用开关控制
# ---------------------------------------------------------------------------
[vars]
WPS_REDIRECT_URI = "https://grid-mobile-cloudflare.pages.dev/wps/oauth/callback"
WPS_SCOPE = "kso.user_base.read"
WPS_AUTHORIZE_URL = "https://openapi.wps.cn/oauth2/auth"
WPS_TOKEN_URL = "https://openapi.wps.cn/oauth2/token"
WPS_USERINFO_URL = "https://openapi.wps.cn/v7/users/current"

# --- CF-WPS-08 增量（非敏感）---
# WPS OpenAPI 基址（record create 上游；测试可指向本地 mock）
WPS_OPENAPI_BASE = "https://openapi.wps.cn"
# WPS 多维表目标文件/表 ID（正式文件 cn229thwalDs；Sheet 指向测试表 13，绝不指向 3/11/15）
WPS_DBSHEET_FILE_ID = "cn229thwalDs"
WPS_DBSHEET_SHEET_ID = "13"
# CF-WPS-20：CORS 白名单（公网 Pages 域名；部署 Pages 后回填）
CF_ALLOWED_ORIGINS = "https://grid-mobile-cloudflare.pages.dev"
# WPS 写开关：公网 E2E 需要 Sheet13 测试写入（生产目标仍由三开关 fail-closed 把关）
ALLOW_WPS_WRITE = "true"

# --- CF-WPS-11 增量（非敏感）---
# H5移动端身份 Sheet ID（业务方经 WPS 网页界面人工创建，实测 id=14）
WPS_DBSHEET_IDENTITY_SHEET_ID = "14"
# 身份桥校验开关（on = 登录时对花名册 Sheet 做 employee_code 存在性+唯一性校验；off = 跳过，仅测试用）
IDENTITY_ROSTER_CHECK = "on"
# 员工花名册 Sheet ID（默认 11「员工信息维护」）
IDENTITY_ROSTER_SHEET_ID = "11"

# --- 花名册（2026-09-17 业务方确认：「花名册」= 飞书多维表格里那张独立的「花名册」表）---
# 事实：飞书 base 内表「花名册」共 1291 名正式员工，16 列：
#   员工编码/姓名/所属部门/职位/性别/年龄/身份证号码/出生日期/入职日期/直接上级/
#   用工关系状态/入司日期/离职日期/完整度百分比/负责区域（在职）/负责区域（离职）
#   · 所属部门 = 班组名（「宁城街道一班」），与登录台账口径一致 → 选人按此收敛
#   · 负责区域（在职）= 网格串（「郑庄村」「专业队」）→ 巡查网格按 员工编码 精确命中
#   ⚠️ 同 base 内另一张「H5花名册表」（tblO3A9wDnA9Lm74）只有 1 条测试数据，不是花名册，勿再指向它。
# 花名册进程内缓存 TTL（毫秒；1291 人 ≈ 7 次**串行**分页 ≈ 10.9s，0 = 关闭）
# 2026-09-18：120000(2min) → 600000(10min)。
#   实测（_t22）冷启动 10.9s / 命中缓存 0.26s，差 40 倍；TTL 太短会让用户每隔几分钟
#   就重新吃一次 11 秒冷启动。花名册人员变动以天计，10 分钟 TTL 业务上无感知。
ROSTER_CACHE_TTL_MS = "600000"
# 身份激活状态（逗号分隔；仅这些「身份状态」可登录，其余统一 401）
IDENTITY_ACTIVE_STATUS = "正常"
# 移动端登录总开关（公网 E2E 需要真实登录链路）
MOBILE_LOGIN_ENABLED = "true"
# Session 有效期（秒；默认 7200 = 2h，下限 300，上限 7 天）
MOBILE_SESSION_TTL_SECONDS = "7200"

# --- CF-WPS-13 巡查目标（fail-closed）---
# 巡查测试目标 Sheet（H5提交测试）。生产三开关见下方 CF-WPS-29 段；
# 缺任一项 → patrolTarget() 回落本测试表。
WPS_DBSHEET_TEST_SHEET_ID = "13"

# --- CF-WPS-29（第四轮任务3）：巡查生产表放行 --------------------------------
# ⚠️ 语义后果重：放行后 **真实 H5 提交流水将写入飞书生产表**（不再是隔离测试表）。
#    patrolTarget() 三开关缺一即回落测试表，故三项必须同时配置才生效。
#    放行前置条件（2026-09-17 已逐项核实，见 test/_t4-prod-probe.mjs）：
#      ①生产表 tblh1MHy3yjJIyiO 表结构 32 列，与 worker 生产分支构建键（经 feishuTypedRecord
#        变换后）完全对齐，无缺列、无类型不匹配；
#      ②生产表当前 0 条记录（未污染存量）；
#      ③已修复「巡查时间/创建时间 被白名单丢弃」缺陷（CF-WPS-30），时刻列能正常落值。
# 回滚：把 MOBILE_PATROL_PRODUCTION_ENABLED 改回 "false"（或注释掉）即可回落测试表，
#          已落生产表的记录需人工清理。
# ⚠️ 2026-09-18 单主台账冻结：已删除测试分支（Q1），主台账 = H5员工日常不安全行为台账。
#    取消以下三个两表 fail-closed 开关（代码 patrolTarget 已改为恒写主台账，见 index.js）。
# MOBILE_PATROL_PRODUCTION_ENABLED = "true"
# MOBILE_PATROL_TARGET_SHEET_ID = "tblh1MHy3yjJIyiO"   # 陈旧 ID，本 base 不存在
# WPS_PATROL_FIELDS_CONFIRMED = "true"

# --- CF-WPS-29：三违库（可选覆盖；unset = 用 index.js 内置 20 条）------------
# 业务方 2026-09-17 下发 20 条标准三违行为。改由后端权威下发（patrol/meta.violation_types），
# 前端宫格不再硬编码 —— 保证「前端可选」与「后端可收」永远一致。
# 需要业务自助增删时取消注释，逗号分隔（注意「脱岗、玩岗、替岗」本身含顿号，不能当分隔符）。
# MOBILE_PATROL_VIOLATION_TYPES = "闯红灯,骑车不戴头盔,逆行,违章停车,超速行驶"
# 问题类型候选（含「三违」，H5 三违分支依赖它；unset = 用内置值）
# MOBILE_PATROL_PROBLEM_TYPES = "三违,环境卫生,设施设备,安全隐患,秩序管理,其他"

# --- CF-WPS-21：定位 → 地理位置（逆地理编码）---
# 方案：离线优先。Worker 内置宁津县 12 个乡镇/街道边界（GCJ-02，DP 简化后 64KB），
#   浏览器 WGS-84 GPS → GCJ-02 → 落面判定（偶奇规则，保留孔洞）→「宁津县+乡镇」。
#   零外部请求、零配额、无网可用；县外坐标给出「县境外（距X约Nkm）」，绝不臆造地址。
# 可选增强：配置 AMAP_WEB_KEY（高德「Web 服务」类型 key，非 JS API key）后，
#   在离线结果基础上补全到村级（formatted_address）；高德失败/超时(4s)/余额不足一律静默回落离线结果。
#   ⚠️ 必须用「Web 服务」key；JS API key 调 REST 端点会返回 USERKEY_PLAT_NOMATCH(10009)。
#   未配置 = 绝不发起任何外部请求（离线单测 B5 断言 amapCalls=0）。
# AMAP_WEB_KEY = ""   # 经 `wrangler secret put AMAP_WEB_KEY` 注入，勿写入本文件

# --- Phase B：存储后端切换（WPS / 飞书 可切换，零行为变更）---
# STORAGE_BACKEND = wps（默认，保持现有 WPS 行为）| feishu（全量切飞书，消除出海挂死）
# 切到 feishu 前须：①飞书应用已开 bitable:app 且文档级协作者=可编辑；②下方 FS_*_TABLE_ID 填好；
#   ③FS_APP_ID / FS_APP_SECRET 经 secret put 注入；④身份表/花名册表已建并导入数据（见 FEISHU_SCHEMA.md）
STORAGE_BACKEND = "feishu"
# 飞书多维表格（STORAGE_BACKEND=feishu 时生效；app_token 取自 base URL /base/ 之后那段）
# 表 ID 为普通标识符（非凭据），已由 setup-feishu-tables.mjs 在 base WX9TbTqJKa7sywsgrU4cVoKdnXb 内建好。
# ⚠️ FS_APP_SECRET 仍须经 `wrangler secret put FS_APP_SECRET` 注入（用轮换后的新值，旧值已暴露）。
FS_APP_TOKEN = "WX9TbTqJKa7sywsgrU4cVoKdnXb"
FS_IDENTITY_TABLE_ID = "tbl58t9kjyDlacSw"  # 「H5移动端身份表」＝登录人员唯一来源（手机号=账号）
FS_ROSTER_TABLE_ID = "tbl2ZHdXX5d8R12a"  # 「花名册」1291 人（选人 + 巡查网格解析的数据源）
FS_PATROL_PRODUCTION_TABLE_ID = "tbl5QiCv5Qbal044"  # 「H5员工日常不安全行为台账」= 唯一主台账（2026-09-18 实测，单主台账口径）
FS_LEDGER_TABLE_ID = "tbl58t9kjyDlacSw"  # 登录身份表（= H5移动端身份表，H5 登录唯一来源）

# --- CF-WPS-41 微信推送（WxPusher）---
# 通道：WxPusher 标准推送。用户在「我的」页点关注链接关注应用后，把自己的 UID 填回 App 完成绑定；
#   绑定关系写在「H5移动端身份表」新增列「微信推送UID」（手机号即账号，一行一人）。
# 接入步骤：
#   ① 到 https://wxpusher.zjiecode.com/admin/ 建应用 → 拿 appToken 和 应用ID
#   ② wrangler secret put WX_APP_TOKEN        # 敏感，绝不写入本文件
#   ③ 把下面两个 URL 填成你自己的应用（非敏感，可直接写这里）
# WX_APP_TOKEN 未配置时：全部推送静默降级（能派活，只是不发微信），不会报错、不会阻断业务。
# 关注链接（type=1 = 应用；id = 应用ID；jump=auto = 已关注时自动跳回）
WX_FOLLOW_URL = "https://wxpusher.zjiecode.com/app/#/follow?type=1&id=REPLACE_ME&jump=auto"
# 微信消息里「查看详情」跳回的地址
WX_APP_URL = "https://grid-mobile-cloudflare.pages.dev/check"

# --- CF-WPS-22 增量：重名消歧「职位」白名单（可选，unset = 用代码内默认值）---
# 业务口径：只有「乡镇作业中心经理 / 管理员及以上」才是网格长；同名里的非网格长（乡镇保洁员/司机等）无权占坑。
# ⚠️ 两套词表不同名：台账「分级」= 管理员/乡镇作业中心经理/公司管理；
#    花名册「职位」= 人工班长(=台账管理员) / 人工片区长(=台账乡镇作业中心经理) / 乡镇保洁员 / 司机 / 中转站管理员 …
#    代码默认白名单已同时收录两套词表（精确等值匹配，故「管理员」不会误放「中转站管理员」）。
# 需要业务自助调整（如新增职位）时取消注释并填写；逗号分隔，`/re/` 形式按正则。
# PATROL_GRID_LEADER_JOBS = "人工班长,人工片区长,项目总经理,安环管理部经理,生产管理部经理,生产作业中心副经理（人工）,管理员,乡镇作业中心经理"

# ---------------------------------------------------------------------------
# 敏感凭据：仅通过 wrangler secret 配置，绝不写入本文件 / Git / 前端
# 配置命令（在 worker 目录执行）：
#   wrangler secret put WPS_CLIENT_ID
#   wrangler secret put WPS_CLIENT_SECRET
#   wrangler secret put JWT_VERIFY_SECRET    # CF-WPS-08：与 server/.env JWT_SECRET 同值，仅用于验签
#   wrangler secret put WORKER_SESSION_SECRET # CF-WPS-11：Worker 专用 Session 签名密钥（独立随机值，
#     与 JWT_VERIFY_SECRET 严格不同——若复用，Worker 签出的 token 会被本地 HSE 后端接受，跨系统信任升级）
#   # Phase B 飞书凭据（STORAGE_BACKEND=feishu 时生效）：
#   wrangler secret put FS_APP_ID
#   wrangler secret put FS_APP_SECRET
#   （FS_APP_SECRET 即飞书开放平台应用的 App Secret；与 WPS_CLIENT_SECRET 互不相关，各自独立轮换）
#   （WPS_CLIENT_SECRET 即 KSO-1 签名的 secretKey=APPKEY；userinfo 调用时由 Worker 服务端生成 X-Kso-* 头）
#
# 说明：
#   WPS_CLIENT_ID   = WPS 开放平台应用的 APPID
#   WPS_CLIENT_SECRET = WPS 开放平台应用的 APPKEY
#   JWT_VERIFY_SECRET = 本地 HSE 后端签发 JWT 的同一密钥（HS256）。Worker 只验签不签发，
#     复用现有 JWT 体系（LOGIN-02 链），不新建认证。
#   WORKER_SESSION_SECRET = CF-WPS-11 移动端 Session JWT 专用签名密钥（HS256，随机 ≥32 字节），
#     仅 Worker 自签自验（iss=hse-worker-mobile / aud=hse-mobile-h5），本地 HSE 后端不知道该密钥。
# 两者仅在 Worker 服务端运行时可用，浏览器端无法获取。
#
# ⚠️ 部署注意（CPU 限制）：bcryptjs 为纯 JS，cost 10 校验约需 50-150ms CPU。
#    Workers 免费计划 10ms CPU 上限会超时；付费计划须在部署时评估 [limits] cpu_ms 配置。
#    本阶段未部署，此项列入报告待授权决策项。
#
# --- CF-WPS bcrypt CPU 预算（仅付费计划生效）---
# bcryptjs cost 10 校验约 50-150ms CPU，超免费计划 10ms 上限会超时。
# 若本 Worker 跑在付费计划，取消下方注释并设合理 cpu_ms（建议 ≥ 500）：
# [limits]
# cpu_ms = 500
# ---------------------------------------------------------------------------

# 说明：本 POC 仅做用户授权 + 用户信息读取，
# 不连接 PG / HSE / JWT，不写库，不接入生产登录。
