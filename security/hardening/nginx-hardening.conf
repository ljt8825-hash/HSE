# ============================================================
# Nginx 安全加固配置片段
# 项目: 宁津环卫 HSE 安全管理系统 v4.1
# 说明: 本文件为安全加固配置片段，需合并到现有 deploy/nginx.conf 中
# 日期: 2026-07-11
# ============================================================

# ---- 1. 隐藏 Nginx 版本号 ----
# 防止攻击者通过版本号获取已知漏洞信息
server_tokens off;

# ---- 2. 安全响应头 ----
# 在 server 或 location 块中添加以下安全头

# 防止点击劫持：禁止页面被嵌入 iframe
add_header X-Frame-Options "DENY" always;

# 启用 HTTP 严格传输安全（HSTS）
# max-age=31536000: 1 年内强制使用 HTTPS
# includeSubDomains: 包含所有子域名
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 内容安全策略（CSP）
# 限制页面只能加载指定来源的资源，防止 XSS 和数据注入
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# 控制 Referer 头信息泄露
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 限制浏览器功能（Permissions-Policy）
# 禁用不必要的浏览器 API，减少攻击面
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# XSS 保护（旧版浏览器兼容）
add_header X-XSS-Protection "1; mode=block" always;

# 防止 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;

# ---- 3. 禁用不必要 HTTP 方法 ----
# 仅允许 GET、POST、HEAD，禁用 DELETE、PUT 等（API 通过 POST 代理）
if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$ ) {
    return 405;
}

# ---- 4. 请求体大小限制 ----
# 限制上传文件大小，防止大文件攻击
client_max_body_size 10m;
client_body_buffer_size 128k;

# ---- 5. 速率限制 ----
# 在 http 块中定义速率限制区域

# 全局请求速率限制：每 IP 每秒 20 个请求，突发队列 100
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=20r/s;
# 登录接口专用限制：每 IP 每秒 3 个请求，突发队列 10
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;
# API 请求限制：每 IP 每秒 15 个请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

# 连接数限制：每 IP 最多 30 个并发连接
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---- 6. WebSocket 安全配置 ----
location /ws/ {
    # WebSocket 代理配置
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # WebSocket 超时设置
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 传递真实客户端信息
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 应用速率限制（WebSocket 连接建立）
    limit_req zone=login_limit burst=5 nodelay;
}

# ---- 7. API 代理配置 ----
location /api/ {
    proxy_pass http://backend;

    # 应用 API 速率限制
    limit_req zone=api_limit burst=20 nodelay;

    # 连接数限制
    limit_conn conn_limit 30;

    # 传递真实客户端信息
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 8. 登录接口专用限制 ----
location /api/auth/login {
    proxy_pass http://backend;

    # 更严格的速率限制
    limit_req zone=login_limit burst=5 nodelay;

    # 传递真实客户端信息
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 9. 静态资源安全配置 ----
location /assets/ {
    # 静态资源缓存
    expires 30d;
    add_header Cache-Control "public, immutable";

    # 静态资源仍需安全头（覆盖上级的 always 标记）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 禁止静态资源目录执行脚本
    location ~* \.(php|jsp|asp|aspx|cgi|pl|sh)$ {
        deny all;
    }
}

# ---- 10. 防止目录遍历 ----
# 禁止访问隐藏文件（如 .git, .env）
location ~ /\. {
    deny all;
    return 404;
}

# 禁止访问备份文件和配置文件
location ~* \.(bak|config|sql|log|ini|conf|env|sh|md)$ {
    deny all;
    return 404;
}

# ---- 11. SSL/TLS 配置（如使用 HTTPS）----
# 仅允许 TLS 1.2 和 TLS 1.3
ssl_protocols TLSv1.2 TLSv1.3;
# 使用强密码套件
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
# 优先使用服务器密码套件
ssl_prefer_server_ciphers on;
# SSL 会话缓存
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
# OCSP Stapling（如使用 Let's Encrypt）
# ssl_stapling on;
# ssl_stapling_verify on;

# ---- 12. 超时配置 ----
# 连接超时
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 65s;
send_timeout 10s;

# ---- 13. 缓冲区溢出保护 ----
# 限制请求头和请求体缓冲区大小
large_client_header_buffers 4 8k;
client_header_buffer_size 1k;

# ---- 14. 日志配置 ----
# 访问日志格式（包含安全相关信息）
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'request_time=$request_time '
                    'upstream_response_time=$upstream_response_time '
                    'ssl_protocol=$ssl_protocol';

# 访问日志
access_log /var/log/nginx/hse_access.log security;
# 错误日志（仅记录 warn 及以上级别）
error_log /var/log/nginx/hse_error.log warn;
