# ============================================================
# HSE 安全管理系统 — Nginx 生产配置
# 部署路径: /etc/nginx/conf.d/hse.conf  (Linux)
# 部署路径: C:\nginx\conf\conf.d\hse.conf (Windows)
# ============================================================
#
# 前置条件:
#   1. 前端构建: cd 安全看板vben && pnpm run build:antd
#   2. 后端启动: cd server && pm2 start ecosystem.config.js
#   3. 检查配置文件: nginx -t
#   4. 重载: nginx -s reload 或 systemctl reload nginx
#
# ============================================================

# ---- HTTP 服务（HTTPS 证书就绪后自动跳转）----
server {
    listen 80;
    server_name your-domain.com;  # 替换为真实域名或 IP
    return 301 https://$host$request_uri;
}

# ---- HTTPS 服务（生产环境强制启用）----
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # -------- SSL 证书配置 --------
    # 正式证书（推荐 Let's Encrypt / 阿里云 / 腾讯云）
    ssl_certificate     /etc/nginx/ssl/hse.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hse.key;

    # 自签名证书（仅开发环境使用）
    # ssl_certificate     /etc/nginx/ssl/hse-selfsigned.crt;
    # ssl_certificate_key /etc/nginx/ssl/hse-selfsigned.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS（强制浏览器使用 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------- 安全头 --------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # -------- 请求限制 --------
    # 限制单个 IP 的请求速率
    limit_req_zone $binary_remote_addr zone=hse_limit:10m rate=30r/s;
    limit_req zone=hse_limit burst=50 nodelay;

    # 限制连接数
    limit_conn_zone $binary_remote_addr zone=hse_conn:10m;
    limit_conn hse_conn 100;

    # -------- 根目录 --------
    root /var/www/hse-safety-dashboard/dist;
    index index.html;
    charset utf-8;

    # -------- Gzip 压缩 --------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # -------- Brotli 压缩（需要 ngx_brotli 模块）-------
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # -------- 静态资源缓存 --------
    # JS/CSS/图片/字体：长期缓存（文件名含 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 尝试提供预压缩版本
        gzip_static on;
        # brotli_static on;  # 需要 ngx_brotli 模块
    }

    # -------- 预压缩文件 --------
    # Vite 构建时已生成 .gz 和 .br 文件，Nginx 自动选择
    location ~* \.(js|css|html|json|svg)$ {
        gzip_static on;
        # brotli_static on;
    }

    # -------- Service Worker 不缓存 --------
    location ~* (sw\.js|workbox.*\.js)$ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT";
    }

    # -------- PWA Manifest --------
    location /manifest.json {
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------- API 反向代理到 Node.js 后端 --------
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # 大文件上传支持
        client_max_body_size 50m;
    }

    # -------- 上传文件服务 --------
    location /uploads/ {
        alias /var/www/hse-safety-dashboard/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # 限制上传目录的文件类型
        # 允许图片、文档、Excel 等
        if ($request_filename ~* \.(jpg|jpeg|png|gif|ico|pdf|doc|docx|xls|xlsx|zip|rar)$) {
            break;
        }
        # 其他文件类型拒绝访问
        return 403;
    }

    # -------- SPA 路由处理 --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------- 安全：拒绝访问隐藏文件 --------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------- 安全：拒绝访问 node_modules --------
    location ~ /node_modules {
        deny all;
        access_log off;
    }

    # -------- 错误页面 --------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # -------- 访问日志 --------
    access_log /var/log/nginx/hse-access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/hse-error.log warn;
}
