# ============================================================
# docker-compose.production.yml — 生产环境服务编排
# 新增: Nginx 反向代理、前端容器、资源限制、重启策略
# ============================================================
# 使用方式:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# ============================================================

services:
  # ---- Nginx 反向代理（入口） ----
  nginx:
    image: nginx:1.27-alpine
    container_name: hse-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/hse.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro                    # SSL 证书
      - frontend-dist:/usr/share/nginx/html:ro     # 前端静态文件
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - hse-network

  # ---- Vue 3 前端（Nginx 静态服务） ----
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    container_name: hse-frontend
    restart: always
    volumes:
      - frontend-dist:/usr/share/nginx/html        # 共享构建产物
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - hse-network

  # ---- Node.js 后端（已有） ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hse-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hse_app}
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-safety_dashboard}
      PYTHON_PATH: python3
      PYTHONIOENCODING: utf-8
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请设置 JWT_REFRESH_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "hse-backend"
      LOGSTASH_HOST: "logstash"
      LOGSTASH_PORT: "5001"
      UPLOAD_DIR: ./uploads
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX_REQUESTS: "500"
    ports:
      - "127.0.0.1:3000:3000"   # 仅内部访问，由 Nginx 代理
    volumes:
      - uploads:/app/server/uploads
      - ./数据源:/app/数据源:ro
      - ./导出文件:/app/导出文件
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - hse-network

  # ---- PostgreSQL 数据库（已有，生产环境需调优） ----
  postgres:
    image: postgres:17-alpine
    container_name: hse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hse_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-safety_dashboard}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # 生产环境性能调优
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "768MB"
      POSTGRES_MAX_CONNECTIONS: "100"
    ports:
      - "127.0.0.1:5432:5432"   # 仅本地访问
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/import_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hse_app} -d ${DB_NAME:-safety_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - hse-network

# ---- 持久化卷 ----
volumes:
  pgdata:
    driver: local
    name: hse_pgdata
  uploads:
    driver: local
    name: hse_uploads
  frontend-dist:
    driver: local
    name: hse_frontend_dist
  nginx-logs:
    driver: local
    name: hse_nginx_logs

# ---- 内部网络 ----
networks:
  hse-network:
    driver: bridge
    name: hse-network
