# ============================================================
# Nginx 配置 — HSE 安全管理系统（Vue 3 SPA + Node.js API）
# 适用于生产环境，含 Gzip/Brotli、缓存策略、API 反向代理
# ============================================================

# ---- 上游 Node.js 后端 ----
upstream hse_backend {
    server 127.0.0.1:3000;
    # 多实例负载均衡时取消注释
    # server 127.0.0.1:3001;
    # server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    server_name hse.example.com;

    # ---- 强制 HTTPS ----
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hse.example.com;

    # ---- SSL 证书（Let's Encrypt / 自签） ----
    ssl_certificate     /etc/nginx/ssl/hse.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/hse.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- HSTS（可选，首次启用建议先设短时间测试） ----
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- 安全响应头 ----
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://sentry.example.com;" always;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        application/wasm;

    # ---- Brotli（需安装 nginx-module-brotli，优先于 gzip） ----
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    # brotli_min_length 1024;

    # ---- 静态资源根目录 ----
    root /usr/share/nginx/html;
    index index.html;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://hse_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件大小限制
        client_max_body_size 20m;

        # 请求体缓冲
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- 上传文件代理 ----
    location /uploads/ {
        proxy_pass http://hse_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }

    # ---- 静态资源缓存（带 hash 的文件长期缓存） ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # 预压缩静态文件
        gzip_static on;
        # brotli_static on;
    }

    # ---- HTML 文件不缓存（SPA 入口） ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    # ---- Vue Router History 模式回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 404 页面（SPA 路由兜底） ----
    error_page 404 /index.html;

    # ---- 健康检查端点直接代理 ----
    location = /api/health {
        proxy_pass http://hse_backend;
        access_log off;
    }

    # ---- 禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- 日志 ----
    access_log /var/log/nginx/hse_access.log;
    error_log  /var/log/nginx/hse_error.log warn;
}
