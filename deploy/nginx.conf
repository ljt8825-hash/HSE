# ============================================================
# Nginx 反向代理配置 — HSE 安全管理系统
# 宁津环卫 HSE 安全管理系统 v4.1
#
# 功能:
#   - 前端静态文件服务 (SPA History 路由)
#   - API 反向代理到后端 Node.js
#   - WebSocket 代理
#   - Gzip 压缩
#   - 静态资源缓存策略
#   - 安全响应头
#   - 速率限制
#   - 自定义访问日志格式
# ============================================================

# ---- 上游后端服务 ----
upstream backend {
    server backend:3000;
    keepalive 32;                # 保持 32 个长连接，减少 TCP 握手开销
}

# ---- 速率限制区域（API 接口限流） ----
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# ---- 访问日志格式（含请求耗时和上游响应时间） ----
log_format hse_access escape=json
    '$time_iso8601 '
    '"$request_method $request_uri" '
    '$status '
    '$body_bytes_sent '
    '"$http_referer" '
    '"$http_user_agent" '
    '$request_time '
    '$upstream_response_time '
    '$remote_addr';

server {
    listen 80;
    server_name _;               # 匹配所有请求头（Docker 内部使用）

    # ---- 静态文件根目录 ----
    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全响应头 ----
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # HSTS（仅 HTTPS 环境）— 生产环境部署 SSL 后生效
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP 策略（根据实际需要调整）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: http://localhost:3000;" always;

    # Permissions Policy — 限制浏览器功能权限
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;                        # 根据 Accept-Encoding 头决定是否压缩
    gzip_proxied any;                    # 对所有代理请求都压缩
    gzip_comp_level 6;                   # 压缩级别（1-9，6 为性能与压缩率平衡点）
    gzip_min_length 1024;                # 仅压缩大于 1KB 的响应
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 禁止访问隐藏文件（如 .env、.git） ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- API 反向代理 ----
    location /api/ {
        limit_req zone=api burst=20 nodelay;  # 允许突发 20 个请求，不延迟
        limit_req_status 429;                   # 超出限制返回 429

        proxy_pass http://backend;
        proxy_http_version 1.1;

        # 传递真实客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 请求体大小限制（支持文件上传）
        client_max_body_size 20m;

        # 代理缓冲设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 访问日志（记录 API 请求详细信息）
        access_log /var/log/nginx/hse_access.log hse_access;
    }

    # ---- 上传文件代理 ----
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;          # 上传文件允许 50MB
        proxy_read_timeout 120s;           # 上传可能需要更长时间
        access_log /var/log/nginx/hse_access.log hse_access;
    }

    # ---- WebSocket 代理 ----
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket 协议升级头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（保持 24 小时不断开）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        access_log /var/log/nginx/hse_access.log hse_access;
    }

    # ---- 带哈希的静态资源（长期缓存 30 天） ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;                    # 静态资源不写访问日志
        gzip_static on;                    # 优先使用预压缩的 .gz 文件
    }

    # ---- 其他静态资源缓存（1 小时） ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm)$ {
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA 入口文件（禁止缓存，确保始终获取最新版本） ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    # ---- Vue Router History 模式回退（未匹配的路径返回 index.html） ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 健康检查端点（直接代理，不记录日志） ----
    location = /api/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ---- 错误页面 ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
