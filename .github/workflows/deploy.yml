# ============================================================
# .github/workflows/deploy.yml — GitHub Actions CI/CD
# 触发: push 到 main/master 分支
# 流程: Lint → Type Check → Test → Build → Deploy
# ============================================================

name: HSE Deploy

on:
  push:
    branches: [main, master]
    paths:
      - '安全看板vben/**'
      - 'server/**'
      - 'package.json'
      - 'Dockerfile.frontend.vben'
      - '.github/workflows/**'

env:
  NODE_VERSION: '22.18.0'
  PNPM_VERSION: '10.33.4'

jobs:
  # ---- Job 1: 代码质量检查 ----
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: 安全看板vben
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: 安全看板vben
        run: pnpm run lint

      - name: TypeScript 类型检查
        working-directory: 安全看板vben/apps/web-naive
        run: pnpm run typecheck

  # ---- Job 2: 单元测试 ----
  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: 安全看板vben
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: 安全看板vben
        run: pnpm run test:unit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ---- Job 3: 构建 + 部署 ----
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: 安全看板vben
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: 安全看板vben
        run: pnpm run build:naive
        env:
          VITE_API_BASE_URL: /api
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: 安全看板vben/apps/web-naive/dist/
          retention-days: 7

      # ---- 部署到服务器（SSH） ----
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/hse-app
            docker compose pull frontend
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d frontend nginx
            docker image prune -f

      # ---- 部署通知（Slack / 飞书可选） ----
      - name: Notify success
        if: success()
        run: echo "Deploy successful! Commit: ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        run: echo "Deploy FAILED! Commit: ${{ github.sha }}"
