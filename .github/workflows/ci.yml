name: HSE CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22.18.0'
  PNPM_VERSION: '10.33.4'

jobs:
  # Job 1: 代码质量检查
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node20-backend-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-backend-

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Backend lint check
        working-directory: server
        run: npx eslint . --max-warnings 0 || echo "ESLint not configured, skipping"

      - name: Security: npm audit
        working-directory: server
        run: npm audit --audit-level=high --production
        continue-on-error: true

      - name: Security: secret scan
        run: |
          echo "=== Secret Scan ==="
          SECRETS=$(grep -rn --include="*.js" \
            -e "hse-safety-dashboard-secret-key" \
            -e "hse-refresh-secret-key" \
            server/ || true)
          if [ -n "$SECRETS" ]; then
            echo "::error::FAILED: Hardcoded secrets found!"
            echo "$SECRETS"
            exit 1
          fi
          echo "::notice::No hardcoded secrets found"

  # Job 2: 后端测试
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safety_dashboard_test
          POSTGRES_USER: hse_test
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node20-backend-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-backend-

      - name: Create .env for testing
        working-directory: server
        run: |
          cat > .env <<EOF
          NODE_ENV=test
          PORT=3000
          DB_HOST=localhost
          DB_PORT=5432
          DB_DATABASE=safety_dashboard_test
          DB_NAME=safety_dashboard_test
          DB_USER=hse_test
          DB_PASSWORD=test_password_123
          DB_POOL_MIN=1
          DB_POOL_MAX=5
          JWT_SECRET=test_jwt_secret_for_ci_only_32chars
          JWT_REFRESH_SECRET=test_jwt_refresh_secret_for_ci_32ch
          JWT_EXPIRES_IN=30m
          JWT_REFRESH_EXPIRES_IN=7d
          CORS_ORIGINS=http://localhost:5173,http://localhost:3000
          EOF

      - name: Initialize test database
        run: |
          PGPASSWORD=test_password_123 psql -h localhost -U hse_test -d safety_dashboard_test -f sql/unified_schema.sql || true
          PGPASSWORD=test_password_123 psql -h localhost -U hse_test -d safety_dashboard_test -f sql/auth_schema.sql || true
          PGPASSWORD=test_password_123 psql -h localhost -U hse_test -d safety_dashboard_test -f sql/migrate_rbac.sql || true
          PGPASSWORD=test_password_123 psql -h localhost -U hse_test -d safety_dashboard_test -f sql/migrate_notifications.sql || true
          PGPASSWORD=test_password_123 psql -h localhost -U hse_test -d safety_dashboard_test -f sql/migrate_workflow.sql || true

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest tests
        working-directory: server
        run: npm test -- --ci --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 7

  # Job 3: 前端构建检查
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: 安全看板vben
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: 安全看板vben
        run: pnpm run typecheck || echo "Typecheck script not configured"

      - name: Build check
        working-directory: 安全看板vben/apps/web-naive
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 安全看板vben/apps/web-naive/dist/
          retention-days: 3

  # Job 4: 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          timeout: '15m'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Dependency audit
        working-directory: server
        run: npm audit --audit-level=moderate --production
        continue-on-error: true
